  kill(z.m[0],20,{gem:5+k});up('atk',5);kill(z.m[1],25);dep(r(G*120));craft(5+k);kill(z.m[2],25,{gem:5+k});up('hp',5);

function calendarKey(weekly=false){
 const date=new Date(Date.now()+9*3600e3);
 if(weekly)date.setUTCDate(date.getUTCDate()-((date.getUTCDay()+6)%7));
 return date.toISOString().slice(0,10);
}
function taskState(weekly=false){
 const key=weekly?'weekly':'daily',period=calendarKey(weekly);
 S.tasks=S.tasks||{};
 let task=S.tasks[key];
 if(!task||task.period!==period)task=S.tasks[key]={period,progress:{login:1},claimed:{},rewards:{}};
 return task;
}
function trackTask(key,amount=1){
 for(const weekly of [false,true]){const task=taskState(weekly);task.progress[key]=(task.progress[key]||0)+amount}
}
function featureEvent(type,key,n){
 const amount=n||1;
 if(type==='kill')trackTask('kills',amount);
 if(type==='chest')trackTask('chest',amount);
 if(type==='craft')trackTask('craft',amount);
 if(type==='up')trackTask('upgrade',amount);
}
function collectionState(){
 if(!S.collection){S.collection={weapons:{...S.weapons},monsters:{...(S.bossKills||{})},claimed:{}}}
 return S.collection;
}
function collectionEntries(tab=bookTab){
 if(tab==='monster')return Object.keys(MT).map(k=>({id:k,name:MT[k].n,img:'mon_'+k,count:collectionState().monsters[k]||0,detail:'Lv.'+MT[k].lv+' · '+(MT[k].boss?'보스':MT[k].elite?'정예':'일반')+' · 체력 '+fmt(MT[k].hp)+' · 공격력 '+fmt(MT[k].atk)}));
 return GR.flatMap((grade,g)=>Object.keys(WT).map(k=>({id:k+'_'+g,name:wName(k+'_'+g),img:'wpn_'+k+'_'+g,count:collectionState().weapons[k+'_'+g]||0,detail:grade.n+' · '+WT[k].ds+' · 사거리 '+WT[k].rg})));
}
function collectAllRewards(apply=false){
 const state=collectionState();let count=0,gems=0;
 for(const tab of ['weapon','monster'])for(const item of collectionEntries(tab)){
  const key=tab+':'+item.id;let claimed=state.claimed[key]||0;
  while(claimed<COLLECT_STEPS.length&&item.count>=COLLECT_STEPS[claimed]){
   claimed++;count++;gems+=2*claimed;
  }
  if(apply)state.claimed[key]=claimed;
 }
 if(apply&&count){S.gem+=gems;calc();save();rewardFly({gem:gems})}
 return{count,gems};
}
function collectionClaimButton(){
 const rewards=collectAllRewards();
 return '<button class="growth-button collection-claim-all" data-a="collectall" '+(rewards.count?'':'disabled')+'>'+ (rewards.count?'모두 받기 · '+rewards.count+'개 / 보석 '+fmt(rewards.gems):'받을 보상 없음')+'</button>';
}
